name: CI

# Runs on every push. Two jobs, deliberately: the pipeline job proves the data
# science actually executes end to end, and the API job proves the business
# logic is still correct. A green tick on a churn repo means something.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    name: Data pipeline and model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r ml/requirements.txt

      # A small run keeps CI under two minutes while still exercising every
      # line of the generator, the feature builder and the trainer.
      - name: Generate a small dataset
        run: python ml/generate_data.py --customers 6000 --out data/

      - name: Build point-in-time features
        run: python ml/build_features.py --data data/ --out data/

      - name: Train and score
        run: python ml/train_model.py --data data/ --artifacts ml/artifacts/

      - name: Assert the model is better than a coin flip
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open('ml/artifacts/metrics.json'))['metrics']
          print(m)
          assert m['roc_auc'] > 0.75, f"AUC regressed to {m['roc_auc']}"
          assert m['brier'] < 0.15, f"Calibration regressed to {m['brier']}"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: ml/artifacts/metrics.json

  api:
    name: API and retention economics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        run: python -m pytest backend/tests -v

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
